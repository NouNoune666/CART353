<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Carte de Montréal</title>

    <link rel="stylesheet" type="text/css" href="projectOne.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.css"
        integrity="sha256-P+hWJNlpL+GBSRYC7cdsDbQH91URmpDeOzLp7DbFRtE=" crossorigin="" />

    <script type="importmap">
{
    "imports": {
        "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js"
    },
    "integrity": {
        "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js": "sha256-gj5JhNAaMi6LCs+jVFOk8sXDe1sWSS2Zlc87m+trLiQ="
    }
}
</script>
</head>

<body>
    <div id="map"> </div>
    <script type="module">
        import { LeafletMap, TileLayer, Marker, Circle, Polygon, Popup } from 'leaflet';
        const map = new LeafletMap('map').setView([45.508, -73.561], 13);
        new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        const marker = new Marker([45.508, -73.561]).addTo(map);
        const circle = new Circle([45.508, -73.561], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 500
        }).addTo(map);
        const polygon = new Polygon([
            [45.508, -73.561],
            [45.502, -73.559],
            [45.509, -73.546]
        ]).addTo(map);
    </script>
</body>

</html>
